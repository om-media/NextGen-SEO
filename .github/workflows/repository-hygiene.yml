name: Repository hygiene

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-files-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block internal and generated files
        run: node scripts/check-public-files.mjs --tracked

      - name: Select changed commit range
        id: commit-range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              range="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
                range="${BEFORE_SHA}..${HEAD_SHA}"
              else
                range="${HEAD_SHA}^!"
              fi
              ;;
            workflow_dispatch)
              range="${HEAD_SHA}^!"
              ;;
            *)
              echo "Unsupported event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          git rev-list --count "$range" >/dev/null
          echo "range=$range" >> "$GITHUB_OUTPUT"

      - name: Scan changed commits for secrets
        run: |
          docker run --rm \
            --network none \
            --volume "$PWD/.git:/repo/.git:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --redact --no-banner \
            --log-opts="${{ steps.commit-range.outputs.range }}"
